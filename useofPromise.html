<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
<script>
    const pr = new Promise(function(resolve,reject){
        setTimeout(()=>{
            let number = Math.ceil((Math.random()*900)+100);
            console.log(number);

            if(number%2==0){
                resolve({status : 'SUCCESS', msg: number})
            }
            else{
                reject({status : 404, msg:'Invalid Number'})
            }
        },3000)
    })


    function consumePromiseWithoutAsyncAndAwait(){
        console.log("Working without async and await");
        console.log("Consuming the promise");

        pr.then((obj)=>{
            console.log(obj);
        })
        .catch(error => {
            console.log(error); 
        })
        console.log("Promise Consumed");
    }

    consumePromiseWithoutAsyncAndAwait();

</script>
</html>
